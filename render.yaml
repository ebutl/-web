services:
  - type: web
    name: err0r-z
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /data/err0r.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
